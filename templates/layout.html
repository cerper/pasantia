<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movilnet Intelligence{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-movilnet-bg text-movilnet-dark">
    <!-- Navbar Fijo -->
    <header class="fixed inset-x-0 top-0 z-50 border-b border-movilnet-input-border bg-movilnet-card">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5 md:px-10">
            <a href="{{ url_for('gestion_reportes') }}" class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-movilnet-primary text-sm font-black text-white">
                    m
                </div>
                <div>
                    <p class="text-xl font-black tracking-tight text-movilnet-primary">movilnet</p>
                    <p class="text-[0.6rem] font-semibold uppercase tracking-[0.24em] text-movilnet-muted">intelligence</p>
                </div>
            </a>
            <div class="relative" id="perfil-menu">
                <button
                    type="button"
                    id="perfil-boton"
                    class="flex items-center gap-3 text-sm text-movilnet-muted"
                    aria-label="Abrir menú de perfil"
                    aria-expanded="false"
                    aria-controls="perfil-dropdown"
                >
                    <span>{{ current_user.nombre }} {{ current_user.apellido }}</span>
                    <i data-lucide="user-circle" class="h-6 w-6 text-movilnet-primary"></i>
                </button>
                <div
                    id="perfil-dropdown"
                    class="absolute right-0 top-full z-10 mt-3 hidden min-w-40 rounded-lg border border-movilnet-input-border bg-white p-2 shadow-lg"
                >
                    <form action="{{ url_for('logout') }}" method="post">
                        <button
                            type="submit"
                            class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-sm font-semibold text-movilnet-dark transition hover:bg-movilnet-bg"
                        >
                            <i data-lucide="log-out" class="h-4 w-4 text-movilnet-primary"></i>
                            <span>Logout</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal compensado con pt-24 para no solaparse con el header -->
    <main class="pt-24">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/escenarios.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
